            allOf:
            - $ref: '#/definitions/github_com_your-username_go-clean-architecture_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_your-username_go-clean-architecture_internal_dto.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_your-username_go-clean-architecture_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_your-username_go-clean-architecture_pkg_response.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_your-username_go-clean-architecture_pkg_response.Response'
